const EnquiryManagement = ({ setPage }) => {
  const session = React.useContext(AuthContext);
  const [enquiries, setEnquiries] = React.useState([]);
  const [loadError, setLoadError] = React.useState('');
  const [replyTarget, setReplyTarget] = React.useState(null);
  const [replyText, setReplyText] = React.useState('');
  const [replying, setReplying] = React.useState(false);
  React.useEffect(() => {
    if (!session?.token) return;
    fetch('http://localhost:5000/api/enquiries', { headers: { Authorization: `Bearer ${session.token}` } })
      .then(async r => { const d = await r.json(); if (!r.ok) throw new Error(d.message || 'Unable to load enquiries.'); return d; })
      .then(setEnquiries).catch(e => setLoadError(e.message));
  }, [session?.token]);
  const resolveEnquiry = async (id) => {
    setLoadError('');
    try {
      const response = await fetch(`http://localhost:5000/api/enquiries/${id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.token}` }, body: JSON.stringify({ status: 'closed' }) });
      const data = await response.json();
      if (!response.ok) throw new Error(data.message || 'Could not resolve enquiry.');
      setEnquiries(items => items.map(e => e.id === id ? { ...e, enquiry_status: 'closed' } : e));
    } catch (error) { setLoadError(error.message); }
  };
  const sendReply = async () => {
    if (!replyText.trim()) { setLoadError('Enter a reply before sending.'); return; }
    setReplying(true); setLoadError('');
    try { const response=await fetch(`http://localhost:5000/api/enquiries/${replyTarget.id}/replies`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.token}`},body:JSON.stringify({reply:replyText})});const data=await response.json();if(!response.ok)throw new Error(data.message||'Reply could not be saved.');setEnquiries(items=>items.map(e=>e.id===replyTarget.id?{...e,enquiry_status:'responded',latest_reply:replyText,reply_count:Number(e.reply_count||0)+1}:e));setReplyTarget(null);setReplyText('');}
    catch(error){setLoadError(error.message);}finally{setReplying(false);}
  };
  const pendingCount = enquiries.filter(e => !['responded','closed'].includes(e.enquiry_status)).length;
  const resolvedCount = enquiries.filter(e => ['responded','closed'].includes(e.enquiry_status)).length;
  return (
    <AdminLayout page="enquiry" setPage={setPage} title="Enquiry Management" subtitle="Customer messages and support requests">
      <div style={{ padding: '24px 28px' }}>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 16, marginBottom: 24 }}>
          <StatCard label="Total Enquiries" value={String(enquiries.length)} sub="Loaded from database" icon="enquiry" />
          <StatCard label="Pending Response" value={String(pendingCount)} sub="Awaiting reply" icon="bell" color={DS.c.warning} />
          <StatCard label="Resolved" value={String(resolvedCount)} sub="Resolved enquiries" icon="check" color={DS.c.success} />
        </div>
        <div className="ga-card" style={{ overflow: 'hidden' }}>
          <div style={{ padding: '14px 18px', borderBottom: `1px solid ${DS.c.border}` }}>
            <h3 style={{ fontFamily: DS.f.serif, fontSize: 18 }}>All Enquiries</h3>
          </div>
          <table className="ga-table">
            <thead><tr><th>ID</th><th>From</th><th>Subject</th><th>Type</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>
              {loadError ? <tr><td colSpan="7" style={{ textAlign: 'center', padding: 24, color: DS.c.warning }}>{loadError}</td></tr> : enquiries.length === 0 ? (
                <tr><td colSpan="7" style={{ textAlign: 'center', padding: 24, color: DS.c.textMuted }}>No enquiry records loaded from database.</td></tr>
              ) : enquiries.map(e => (
                <tr key={e.id}>
                  <td style={{ fontFamily: DS.f.serif, fontWeight: 600, color: DS.c.gold, fontSize: 12 }}>{e.id}</td>
                  <td style={{ fontWeight: 500 }}>{e.name}</td>
                  <td>{e.subject || 'General enquiry'}</td>
                  <td><span style={{ fontSize: 11, background: DS.c.beigeLight, color: DS.c.textMid, padding: '2px 8px', borderRadius: DS.r.full, textTransform: 'capitalize' }}>{e.subject || 'general'}</span></td>
                  <td style={{ fontSize: 13, color: DS.c.textMuted }}>{e.created_at ? new Date(e.created_at).toLocaleDateString() : ''}</td>
                  <td><Badge status={['responded','closed'].includes(e.enquiry_status) ? 'confirmed' : 'pending'} text={e.enquiry_status === 'closed' ? 'Resolved' : e.enquiry_status === 'responded' ? 'Responded' : 'Pending'} /></td>
                  <td>
                    <div style={{ display: 'flex', gap: 6 }}>
                      <Button variant="primary" size="xs" onClick={()=>{setReplyTarget(e);setReplyText(e.latest_reply||'');}}>Reply</Button>
                      <Button variant="ghost" size="xs" icon="check" onClick={() => resolveEnquiry(e.id)}>Resolve</Button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
      <Modal open={!!replyTarget} onClose={()=>setReplyTarget(null)} title={replyTarget?`Reply to ${replyTarget.name}`:'Reply'} width={560}>
        {replyTarget&&<div style={{display:'flex',flexDirection:'column',gap:14}}><div style={{padding:14,background:DS.c.beigeLight,borderRadius:DS.r.md}}><div style={{fontWeight:600,marginBottom:6}}>{replyTarget.subject||'General enquiry'}</div><div style={{fontSize:13,color:DS.c.textMid,lineHeight:1.6}}>{replyTarget.message}</div><div style={{fontSize:12,color:DS.c.textMuted,marginTop:8}}>{replyTarget.email}{replyTarget.phone?` · ${replyTarget.phone}`:''}</div></div><div><label style={{fontSize:12,fontWeight:600,textTransform:'uppercase',display:'block',marginBottom:6}}>Response</label><textarea className="ga-input" value={replyText} onChange={e=>setReplyText(e.target.value)} style={{padding:'10px 14px',minHeight:130,resize:'vertical'}} placeholder="Write the response to this enquiry…"/></div><Button disabled={replying} variant="primary" fullWidth onClick={sendReply}>Save Reply</Button></div>}
      </Modal>
    </AdminLayout>
  );
};



// ─── STAFF DOCUMENT VERIFICATION ─────────────────────────────────────────────
const StaffVerification = ({ setPage }) => {
  const session = React.useContext(AuthContext);
  const [pendingRecords, setPendingRecords] = React.useState([]);
  const [checks, setChecks] = React.useState({ name: false, valid: false, booking: false });
  const [status, setStatus] = React.useState('Pending Verification');
  const [message, setMessage] = React.useState('Staff must verify the guest document before confirming check-in.');
  const [messageType, setMessageType] = React.useState('note');
  const [arrivingGuests, setArrivingGuests] = React.useState(1);
  const [staffNotes, setStaffNotes] = React.useState('');
  const [documentType, setDocumentType] = React.useState('passport');
  const [documentFile, setDocumentFile] = React.useState(null);
  const [loading, setLoading] = React.useState(true);
  const loadPendingRecords = async () => {
    if (!session?.token) return;
    const response = await fetch('http://localhost:5000/api/verifications/pending', { headers: { Authorization: `Bearer ${session.token}` } });
    const data = await response.json();
    if (!response.ok) throw new Error(data.message || 'Pending verifications could not be loaded.');
    setPendingRecords(data);
    return data;
  };
  React.useEffect(() => {
    if (!session?.token) return;
    loadPendingRecords()
      .catch(e => { setMessageType('error'); setMessage(e.message); })
      .finally(() => setLoading(false));
  }, [session?.token]);

  const [selectedId, setSelectedId] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  const live = pendingRecords.find(r => String(r.verification_id) === selectedId) || pendingRecords[0] || {};
  React.useEffect(() => {
    setChecks({ name: false, valid: false, booking: false });
    setStatus(live.verification_status === 'verified' ? 'Verified' : 'Pending Verification');
    setArrivingGuests(Number(live.total_guests || 1));
    setStaffNotes('');
    setDocumentType(live.document_type || 'passport');
    setDocumentFile(null);
    setMessageType('note');
    setMessage(live.verification_status === 'verified'
      ? 'The guest document is verified. Confirm the arriving guest count before check-in.'
      : live.document_id
        ? 'Review the uploaded guest document before confirming check-in.'
        : 'Scan or upload the guest document at reception before verification.');
  }, [live.verification_id]);
  const booking = {
    bookingId: live.booking_ref || '', guestName: live.guest_name || '', roomType: live.room_type || '',
    roomNumber: live.room_number || '', guestCount: live.total_guests || 0,
    adults: live.adults || 0, children: live.children || 0, seniors: live.seniors || 0,
    roomCapacity: live.max_capacity || 0, paymentStatus: live.payment_status || 'pending', totalAmount: live.total_amount_inr || 0,
    checkIn: String(live.check_in_date || '').slice(0,10), checkOut: String(live.check_out_date || '').slice(0,10),
    documentType: live.document_type || '', documentName: live.file_path || 'No file uploaded'
  };
  const act = async (action) => {
    if (!live.verification_id || busy) return;
    if (action === 'verified' && !live.document_id) {
      setMessageType('error'); setMessage('Scan or upload the guest document before verification.'); return;
    }
    if (action === 'verified' && (!checks.name || !checks.valid || !checks.booking)) {
      setMessageType('error'); setMessage('Complete every checklist item first.'); return;
    }
    if (action === 'rejected' && !staffNotes.trim()) {
      setMessageType('error'); setMessage('Add a brief reason in staff notes before rejecting verification.'); return;
    }
    if (action === 'confirmed_check_in') {
      if (status !== 'Verified') { setMessageType('error'); setMessage('Verify the document before confirming check-in.'); return; }
      if (!Number.isInteger(Number(arrivingGuests)) || Number(arrivingGuests) < 1) {
        setMessageType('error'); setMessage('Arriving guest count must be a positive whole number.'); return;
      }
    }
    setBusy(true);
    try {
      const response = await fetch(`http://localhost:5000/api/verifications/${live.verification_id}/action`, { method:'PATCH', headers:{'Content-Type':'application/json', Authorization:`Bearer ${session.token}`}, body:JSON.stringify({action, notes:staffNotes.trim(), arrivingGuests:Number(arrivingGuests)}) });
      const data = await response.json();
      if (!response.ok) throw new Error(data.message || 'Action failed.');
      setStatus(action === 'verified' ? 'Verified' : action === 'rejected' ? 'Verification Rejected' : 'Checked In');
      setMessageType('success'); setMessage(data.message);
      if (action === 'verified') setPendingRecords(rows => rows.map(r => r.verification_id === live.verification_id ? { ...r, verification_status:'verified' } : r));
      if (action !== 'verified') setPendingRecords(rows => rows.filter(r => r.verification_id !== live.verification_id));
    } catch (error) { setMessageType('error'); setMessage(error.message); }
    finally { setBusy(false); }
  };
  const verifyDocument = () => act('verified');
  const rejectVerification = () => act('rejected');
  const confirmCheckIn = () => act('confirmed_check_in');
  const uploadDocument = async () => {
    if (!live.booking_id || busy) return;
    if (!documentFile) { setMessageType('error'); setMessage('Choose a scanned PDF, PNG or JPEG document.'); return; }
    if (documentFile.size > 5 * 1024 * 1024) { setMessageType('error'); setMessage('Document must be 5 MB or smaller.'); return; }
    setBusy(true);
    try {
      const fileData = await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = () => reject(new Error('Could not read the selected document.')); reader.readAsDataURL(documentFile); });
      const response = await fetch(`http://localhost:5000/api/verifications/${live.booking_id}/upload`, { method:'POST', headers:{'Content-Type':'application/json', Authorization:`Bearer ${session.token}`}, body:JSON.stringify({documentType, fileData}) });
      const data = await response.json();
      if (!response.ok) throw new Error(data.message || 'Document upload failed.');
      await loadPendingRecords();
      setDocumentFile(null);
      setMessageType('success'); setMessage('Document uploaded. Review it and complete the verification checklist.');
    } catch (error) { setMessageType('error'); setMessage(error.message); }
    finally { setBusy(false); }
  };
  const viewDocument = async () => {
    try {
      const response = await fetch(`http://localhost:5000/api/verifications/documents/${live.document_id}`, {headers:{Authorization:`Bearer ${session.token}`}});
      if (!response.ok) throw new Error('Document could not be downloaded.');
      const url = URL.createObjectURL(await response.blob());
      const link = document.createElement('a'); link.href = url; link.download = live.file_path; link.click();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
    } catch (error) { setMessageType('error'); setMessage(error.message); }
  };

  const messageStyle = messageType === 'success'
    ? { background: '#E9F8F1', borderLeft: `4px solid ${DS.c.success}`, color: '#0B7A4B' }
    : messageType === 'error'
      ? { background: '#FDECEC', borderLeft: `4px solid ${DS.c.danger}`, color: '#B42318' }
      : { background: '#FFF7E6', borderLeft: `4px solid ${DS.c.gold}`, color: '#8A5A12' };

  return (
    <AdminLayout page="staffverify" setPage={setPage} title="Staff Document Verification" subtitle="Verify guest identity before confirming check-in">
      <style>{`
        .staff-verification-grid { display:grid; grid-template-columns:minmax(320px, 1fr) minmax(420px, 1.15fr); gap:24px; }
        .staff-verification-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:24px; }
        .staff-document-controls { display:grid; grid-template-columns:minmax(150px, .7fr) minmax(220px, 1.3fr); gap:12px; margin-top:14px; text-align:left; }
        @media (max-width: 1050px) { .staff-verification-grid { grid-template-columns:1fr; } }
        @media (max-width: 600px) {
          .staff-verification-wrap { padding:16px !important; }
          .staff-verification-card { padding:20px !important; }
          .staff-document-controls { grid-template-columns:1fr; }
          .staff-verification-actions > button { width:100%; justify-content:center; }
        }
      `}</style>
      <div className="staff-verification-wrap" style={{ padding: 28 }}>
        <div style={{ padding:'14px 16px', borderRadius:DS.r.md, border:`1px solid ${DS.c.border}`, background:'#EAF3EE', color:'#24583E', marginBottom:20, lineHeight:1.55 }}>
          <strong>{live.verification_status === 'verified' ? 'Identity verified.' : 'Reception verification required.'}</strong>{' '}
          {live.verification_status === 'verified' ? 'Confirm the arriving guest count to complete check-in.' : live.document_id ? 'Review the uploaded ID and booking details before allowing check-in.' : 'Scan or upload the guest ID at reception before verification.'}
        </div>
        <div className="staff-verification-grid">
          <div className="ga-card staff-verification-card" style={{ padding: 26, background: DS.c.navy, color: DS.c.white }}>
            <h2 style={{ fontFamily: DS.f.serif, fontSize: 24, color: DS.c.gold, marginBottom: 22 }}>Booking Summary</h2>
            {[
              ['Booking ID', booking.bookingId],
              ['Guest Name', booking.guestName],
              ['Room Type', booking.roomType],
              ['Room Number', booking.roomNumber || 'Assigned at check-in'],
              ['Booked Guests', `${booking.adults} adults · ${booking.children} children · ${booking.seniors} seniors`],
              ['Room Capacity', booking.roomCapacity ? `${booking.roomCapacity} guests` : 'Not set'],
              ['Check-in Date', booking.checkIn],
              ['Check-out Date', booking.checkOut],
              ['Payment', `${String(booking.paymentStatus).replaceAll('_',' ')} · ${formatAUD(booking.totalAmount)}`],
              ['Document Type', booking.documentType],
              ['Document File', booking.documentName],
            ].map(([label, value]) => (
              <div key={label} style={{ display: 'flex', justifyContent: 'space-between', gap: 20, padding: '10px 0', borderBottom: '1px solid rgba(255,255,255,0.08)', fontSize: 14 }}>
                <span style={{ color: 'rgba(255,255,255,0.55)' }}>{label}</span>
                <strong style={{ textAlign: 'right', color: DS.c.white }}>{value}</strong>
              </div>
            ))}
            <div style={{ display: 'inline-block', marginTop: 20, padding: '10px 14px', borderRadius: DS.r.full, fontSize: 12, fontWeight: 700, background: status === 'Verified' ? '#DCFCE7' : status.includes('Rejected') ? '#FEE2E2' : '#FFF7E6', color: status === 'Verified' ? '#15803D' : status.includes('Rejected') ? '#DC2626' : '#9B6200' }}>
              {status}
            </div>
            <div style={{ ...messageStyle, marginTop: 18, padding: 14, borderRadius: DS.r.md, fontSize: 13, lineHeight: 1.6 }}>
              {message}
            </div>
          </div>

          <div className="ga-card staff-verification-card" style={{ padding: 26 }}>
            <h2 style={{ fontFamily: DS.f.serif, fontSize: 24, color: DS.c.navy, marginBottom: 18 }}>Verify Guest at Reception</h2>
            {loading && <div style={{padding:14,background:DS.c.beigeLight,borderRadius:DS.r.md,color:DS.c.textMuted,marginBottom:18}}>Loading pending verifications…</div>}
            {!loading && !pendingRecords.length && <div style={{padding:14,background:DS.c.beigeLight,borderRadius:DS.r.md,color:DS.c.textMuted,marginBottom:18}}>There are no pending guest verifications.</div>}
            <div style={{ border: `2px dashed ${DS.c.border}`, borderRadius: DS.r.lg, padding: 24, textAlign: 'center', background: DS.c.beigeLight, marginBottom: 18 }}>
              <div style={{ fontSize: 28, marginBottom: 8 }}>📄</div>
              <p style={{ color: DS.c.textMuted, marginBottom: 12 }}>Select a booking, then scan or upload the guest ID document at reception.</p>
              <select className="ga-input" value={live.verification_id || ''} onChange={e => setSelectedId(e.target.value)}>
                {!pendingRecords.length && <option value="">No pending verifications</option>}
                {pendingRecords.map(r => <option key={r.verification_id} value={r.verification_id}>{r.booking_ref} — {r.guest_name}</option>)}
              </select>
              <div className="staff-document-controls">
                <Select label="Document Type" value={documentType} onChange={e=>setDocumentType(e.target.value)} options={[
                  {value:'passport',label:'Passport'},
                  {value:'aadhaar_card',label:'Aadhaar Card'},
                  {value:'drivers_license',label:'Driving Licence'},
                  {value:'national_id',label:'National ID'},
                  {value:'other',label:'Other'},
                ]} />
                <div>
                  <label style={{fontSize:12,fontWeight:600,letterSpacing:'0.05em',color:DS.c.textMid,textTransform:'uppercase',display:'block',marginBottom:6}}>Scanned Document</label>
                  <input className="ga-input" type="file" accept=".pdf,.png,.jpg,.jpeg" onChange={e=>setDocumentFile(e.target.files?.[0] || null)} style={{padding:'9px 12px'}} disabled={!live.verification_id || busy} />
                </div>
              </div>
              <div style={{display:'flex',gap:10,justifyContent:'center',flexWrap:'wrap',marginTop:12}}>
                <Button variant="primary" size="sm" disabled={!live.verification_id || !documentFile || busy} onClick={uploadDocument}>{live.document_id ? 'Replace Document' : 'Upload Document'}</Button>
                <Button variant="outline" size="sm" disabled={!live.document_id || busy} onClick={viewDocument}>Download Document</Button>
              </div>
            </div>
            <label style={{ fontSize: 13, fontWeight: 600 }}>Document Type: {booking.documentType || 'None'}</label>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 12, marginTop: 8 }}>
              {[
                ['name', 'Guest name matches the document'],
                ['valid', 'Document is valid and not expired'],
                ['booking', 'Booking details match guest information'],
              ].map(([key, label]) => (
                <label key={key} style={{ display: 'flex', alignItems: 'center', gap: 10, fontSize: 14, color: DS.c.textMid }}>
                  <input type="checkbox" checked={checks[key]} onChange={e => setChecks({ ...checks, [key]: e.target.checked })} disabled={!live.document_id || busy} style={{ accentColor: DS.c.gold }} />
                  {label}
                </label>
              ))}
            </div>
            <div style={{ borderTop:`1px solid ${DS.c.border}`, marginTop:22, paddingTop:20 }}>
              <label style={{fontSize:13,fontWeight:600,display:'block',marginBottom:8}}>Guests arriving <span style={{fontWeight:400,color:DS.c.textMuted}}>(editable)</span></label>
              <div style={{padding:12,background:DS.c.beigeLight,borderRadius:DS.r.md,color:DS.c.textMid,fontSize:13,marginBottom:10}}>
                Originally booked: <strong>{booking.guestCount}</strong> · Room capacity for reference: <strong>{booking.roomCapacity || 'Not set'}</strong>
              </div>
              <input className="ga-input" type="number" min="1" value={arrivingGuests} onChange={e=>setArrivingGuests(e.target.value)} disabled={!live.verification_id || busy} aria-label="Guests arriving" style={{padding:'10px 14px',boxSizing:'border-box'}} />
            </div>
            <div style={{marginTop:16}}>
              <label style={{fontSize:13,fontWeight:600,display:'block',marginBottom:8}}>Staff notes</label>
              <textarea className="ga-input" rows="3" maxLength="1000" value={staffNotes} onChange={e=>setStaffNotes(e.target.value)} placeholder="Add a brief reason if verification fails. Do not enter full ID numbers." style={{resize:'vertical',padding:'10px 14px'}} disabled={!live.verification_id || busy} />
            </div>
            <div className="staff-verification-actions">
              <Button variant="danger" size="sm" disabled={!live.verification_id || busy} onClick={rejectVerification}>Reject Verification</Button>
              <Button variant="primary" size="sm" disabled={!live.verification_id || !live.document_id || busy || status === 'Verified'} onClick={verifyDocument}>Verify ID</Button>
              <Button variant="outline" size="sm" disabled={!live.verification_id || busy || status !== 'Verified'} onClick={confirmCheckIn}>Confirm Check-in</Button>
            </div>
          </div>
        </div>
      </div>
    </AdminLayout>
  );
};

// ─── LIVE ROOM MANAGEMENT ────────────────────────────────────────────────────
const LiveRoomManagement = ({ setPage }) => {
  const session = React.useContext(AuthContext);
  return (
    <AdminLayout page="liveroommgmt" setPage={setPage} title="Live Room Management" subtitle="Rooms, parking, occupancy and operations">
      <style>{`.live-embed-frame { width: 100%; height: calc(100vh - 60px); min-height: 720px; border: 0; display: block; background: #0b1220; }`}</style>
      <iframe className="live-embed-frame" src="live-room-management/index.html" onLoad={e => e.currentTarget.contentWindow.postMessage({type:'gdr-session', token:session?.token || ''}, window.location.origin)} title="Live Room Management with Parking System" />
    </AdminLayout>
  );
};

// ─── ENERGY USAGE OVERVIEW ──────────────────────────────────────────────────
const EnergyUsageOverview = ({ setPage }) => {
  const session = React.useContext(AuthContext);
  return (
    <AdminLayout page="energyusage" setPage={setPage} title="Energy Usage" subtitle="Live readings, sensors and equipment faults">
      <style>{`.live-embed-frame { width: 100%; height: calc(100vh - 60px); min-height: 720px; border: 0; display: block; background: #0B1628; }`}</style>
      <iframe className="live-embed-frame" src="energy-usage-overview/index.html?v=energy-intelligence1" onLoad={e => e.currentTarget.contentWindow.postMessage({type:'gdr-energy-session',token:session?.token || ''},window.location.origin)} title="Energy Usage Overview" />
    </AdminLayout>
  );
};

// Export dashboard pages
Object.assign(window, {
  CustomerDashboard, AdminDashboard, BookingManagement, RoomManagement, StaffManagement, StaffVerification, LiveRoomManagement, EnergyUsageOverview,
  CheckInOut, UserManagement, PaymentPage, EnquiryManagement, AdminLayout,
});

</script>
<script type="text/babel">

// ─── MAIN APP — ROUTER + TWEAKS ───────────────────────────────────────────────

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#C9A96E",
  "fontStyle": "serif",
  "navTransparent": true,
  "darkSidebar": true
}/*EDITMODE-END*/;

const App = () => {
  // Always start on the public home page when the website is opened.
  // Login is selected from the Sign In page, then the user is routed by role.
  const [session, setSession] = React.useState(null);
  const userRole = session?.user.role || '';
  const [page, setPage] = React.useState('home');
  const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);
  const [tweaksVisible, setTweaksVisible] = React.useState(false);

  React.useEffect(() => {
    // A new site opening always starts from the public Home page.
    // Role access is selected again from Sign In, while in-page role navigation stays active until Logout.
    try { ['ga_role', 'gdr_token', 'gdr_user'].forEach(key => localStorage.removeItem(key)); localStorage.setItem('ga_page', 'home'); } catch(e) {}
  }, []);

  React.useEffect(() => {
    try { localStorage.setItem('ga_page', page); } catch(e) {}
    window.scrollTo(0, 0);
  }, [page]);

  const publicPages = ['home', 'rooms', 'roomdetail', 'contact'];
  const customerPages = ['rooms', 'roomdetail', 'booking', 'contact', 'customerdash'];
  const staffPages = ['staffverify', 'checkinout', 'bookingmgmt', 'enquiry'];
  const adminPages = ['admin', 'bookingmgmt', 'checkinout', 'staffverify', 'roommgmt', 'liveroommgmt', 'energyusage', 'staffmgmt', 'usermgmt', 'payment', 'enquiry'];
  const rolePages = userRole === 'admin' ? adminPages : userRole === 'staff' ? staffPages : userRole === 'customer' ? customerPages : [...publicPages, 'auth'];
  const landingPage = userRole === 'admin' ? 'admin' : userRole === 'staff' ? 'staffverify' : userRole === 'customer' ? 'customerdash' : 'home';

  React.useEffect(() => {
    if (!userRole) {
      if (page === 'booking') setPage('auth');
      else if (!rolePages.includes(page)) setPage('home');
    } else if (!rolePages.includes(page)) {
      setPage(landingPage);
    }
  }, [userRole, page]);

  const logout = () => {
    if (session) fetch(AUTH_API + '/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + session.token } }).catch(() => {});
    setSession(null);
    setPage('auth');
  };

  React.useEffect(() => {
    if (!session) return;
    let active = true;
    const controller = new AbortController();
    const verify = async () => {
      try {
        const response = await fetch(AUTH_API + '/me', { headers: { Authorization: 'Bearer ' + session.token }, signal: controller.signal });
        const data = await response.json();
        if (active && (response.status === 401 || response.status === 403 || (response.ok && data.user?.role !== session.user.role))) {
          setSession(null); setPage('auth');
        }
      } catch (_) { /* A temporary network failure does not grant additional access. */ }
    };
    const expiry = JSON.parse(atob(session.token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).exp * 1000;
    const expire = setTimeout(() => { setSession(null); setPage('auth'); }, Math.min(Math.max(0, expiry - Date.now()), 2147483647));
    const timer = setInterval(verify, 60000);
    // Do not verify on window focus: closing the native file picker also fires
    // focus and could interrupt a document upload by routing to Sign In.
    return () => { active = false; controller.abort(); clearTimeout(expire); clearInterval(timer); };
  }, [session]);

  // Tweaks panel communication
  React.useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const updateTweak = (key, val) => {
    const next = { ...tweaks, [key]: val };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: val } }, '*');
  };

  // Public pages with nav
  const isPublic = publicPages.includes(page);
  const isAuth = page === 'auth';
  const isCustomerDash = page === 'customerdash';
  const isAdmin = ['admin', 'bookingmgmt', 'roommgmt', 'liveroommgmt', 'energyusage', 'staffmgmt', 'staffverify', 'checkinout', 'usermgmt', 'payment', 'enquiry'].includes(page);

  const renderPage = () => {
    if (!rolePages.includes(page)) return null;
    switch(page) {
      case 'home':       return <HomePage setPage={setPage} />;
      case 'rooms':      return <RoomsPage setPage={setPage} />;
      case 'roomdetail': return <RoomDetailPage setPage={setPage} />;
      case 'booking':    return <BookingPage setPage={setPage} />;
      case 'contact':    return <ContactPage setPage={setPage} />;
      case 'auth':       return <AuthPage setPage={setPage} setSession={setSession} />;
      case 'customerdash': return <CustomerDashboard setPage={setPage} />;
      case 'admin':      return <AdminDashboard setPage={setPage} />;
      case 'bookingmgmt': return <BookingManagement setPage={setPage} />;
      case 'roommgmt':   return <RoomManagement setPage={setPage} />;
      case 'liveroommgmt': return <LiveRoomManagement setPage={setPage} />;
      case 'energyusage': return <EnergyUsageOverview setPage={setPage} />;
      case 'staffmgmt':  return <StaffManagement setPage={setPage} />;
      case 'staffverify': return <StaffVerification setPage={setPage} />;
      case 'checkinout': return <CheckInOut setPage={setPage} />;
      case 'usermgmt':   return <UserManagement setPage={setPage} />;
      case 'payment':    return <PaymentPage setPage={setPage} />;
      case 'enquiry':    return <EnquiryManagement setPage={setPage} />;
      default:           return <HomePage setPage={setPage} />;
    }
  };

  return (
    <div style={{ position: 'relative' }}>
      {isPublic && !userRole && <PublicNav page={page} setPage={setPage} transparent={page === 'home'} />}
      <div className={isAdmin || isCustomerDash ? '' : isPublic ? 'page-scroll' : ''} style={isAdmin || isCustomerDash ? {} : { overflowX: 'hidden' }}>
        <AuthContext.Provider value={session}>{renderPage()}</AuthContext.Provider>
      </div>

      {/* Nav Menu Bar at bottom — quick page switcher for demo */}
      {userRole && <div style={{
        position: 'fixed', bottom: 16, left: '50%', transform: 'translateX(-50%)',
        background: DS.c.navy, borderRadius: DS.r.full, boxShadow: DS.s.lg,
        padding: '8px 14px', display: 'flex', alignItems: 'center', gap: 4, zIndex: 9999,
        border: `1px solid rgba(201,169,110,0.2)`, maxWidth: 'calc(100vw - 24px)', overflowX: 'auto',
      }}>
        <div title="Giri Darshan Residency" style={{ width: 28, height: 28, borderRadius: '50%', background: `linear-gradient(135deg, ${DS.c.gold}, ${DS.c.goldDark})`, color: DS.c.navy, fontFamily: DS.f.serif, fontWeight: 700, fontSize: 11, display: 'flex', alignItems: 'center', justifyContent: 'center', marginRight: 6, flexShrink: 0 }}>GD</div>
        {[
          ['home','🏨','Home'],['rooms','bed-icon','Rooms'],['roomdetail','🔍','Detail'],
          ['booking','📋','Book'],['contact','✉️','Contact'],['customerdash','👤','My Stay'],
          ['staffverify','🪪','Verify'],['bookingmgmt','📁','Bookings'],['checkinout','🔑','Check-In'],['liveroommgmt','🏢','Live Rooms'],['energyusage','⚡','Energy'],['enquiry','💬','Enquiries'],
          ['admin','📊','Admin'],['roommgmt','🏠','Rooms Mgmt'],['staffmgmt','🧑‍💼','Staff'],['usermgmt','👥','Users'],['payment','💳','Payments'],
        ].filter(([p]) => rolePages.includes(p)).map(([p, emoji, label]) => (
          <button key={p} onClick={() => setPage(p)} title={label} style={{
            background: page === p ? DS.c.gold : 'transparent', border: 'none', cursor: 'pointer',
            width: 28, height: 28, borderRadius: '50%', fontSize: 13, display: 'flex', alignItems: 'center',
            justifyContent: 'center', transition: 'background 0.15s', flexShrink: 0,
          }}>{emoji === 'bed-icon' ? <Icon name="bed" size={15} color={page === p ? DS.c.navy : DS.c.white} /> : emoji}</button>
        ))}
        <button onClick={logout} title="Logout" style={{ background: 'transparent', border: 'none', cursor: 'pointer', width: 28, height: 28, borderRadius: '50%', fontSize: 13, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>🚪</button>
      </div>}

      {/* Tweaks Panel */}
      {tweaksVisible && (
        <div style={{
          position: 'fixed', bottom: 60, right: 20, background: DS.c.white,
          borderRadius: DS.r.xl, boxShadow: DS.s.lg, padding: '22px',
          width: 280, zIndex: 10000, border: `1px solid ${DS.c.borderLight}`,
        }}>
          <div style={{ fontFamily: DS.f.serif, fontSize: 18, fontWeight: 600, marginBottom: 18, paddingBottom: 12, borderBottom: `1px solid ${DS.c.border}` }}>Tweaks</div>

          <div style={{ marginBottom: 16 }}>
            <label style={{ fontSize: 11, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.08em', color: DS.c.textMuted, display: 'block', marginBottom: 8 }}>Accent Color</label>
            <div style={{ display: 'flex', gap: 8 }}>
              {[['#C9A96E','Classic Gold'],['#8B6E3C','Deep Bronze'],['#5B8C5A','Forest'],['#4A7B9D','Azure'],['#8B4A6B','Rose Gold']].map(([c, l]) => (
                <div key={c} title={l} onClick={() => updateTweak('accentColor', c)} style={{ width: 28, height: 28, background: c, borderRadius: '50%', cursor: 'pointer', border: tweaks.accentColor === c ? `3px solid ${DS.c.navy}` : '3px solid transparent', transition: 'border 0.15s' }} />
              ))}
            </div>
          </div>

          <div style={{ marginBottom: 16 }}>
            <label style={{ fontSize: 11, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.08em', color: DS.c.textMuted, display: 'block', marginBottom: 8 }}>View Demo Page</label>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 6 }}>
              {[['home','🏨 Home'],['rooms','🛏 Rooms'],['booking','📋 Booking'],['admin','📊 Admin'],['customerdash','👤 Dashboard'],['payment','💳 Payments']].map(([p, l]) => (
                <button key={p} onClick={() => setPage(p)} style={{ padding: '7px 10px', background: page === p ? DS.c.navy : DS.c.beigeLight, color: page === p ? DS.c.white : DS.c.textMid, border: 'none', borderRadius: DS.r.md, cursor: 'pointer', fontSize: 12, fontFamily: DS.f.sans, transition: 'all 0.15s' }}>{l}</button>
              ))}
            </div>
          </div>

          <div>
            <label style={{ fontSize: 11, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.08em', color: DS.c.textMuted, display: 'block', marginBottom: 8 }}>Transparent Hero Nav</label>
            <div style={{ display: 'flex', gap: 6 }}>
              {[['true','Yes'],['false','No']].map(([v, l]) => (
                <button key={v} onClick={() => updateTweak('navTransparent', v === 'true')} style={{ flex: 1, padding: '7px', background: String(tweaks.navTransparent) === v ? DS.c.navy : DS.c.beigeLight, color: String(tweaks.navTransparent) === v ? DS.c.white : DS.c.textMid, border: 'none', borderRadius: DS.r.md, cursor: 'pointer', fontSize: 12, fontFamily: DS.f.sans }}>{l}</button>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

// Mount app
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
</body>
</html>
