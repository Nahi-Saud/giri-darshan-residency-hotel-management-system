// ─── MINI LINE CHART ──────────────────────────────────────────────────────────
const MiniLineChart = ({ data, color = DS.c.gold, height = 60 }) => {
  const vals = data.map(d => d.value);
  const max = Math.max(...vals), min = Math.min(...vals);
  const range = max - min || 1;
  const w = 300, h = height;
  const pts = vals.map((v, i) => `${(i / (vals.length - 1)) * w},${h - ((v - min) / range) * (h - 10) - 5}`).join(' ');
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: '100%', height }} preserveAspectRatio="none">
      <defs>
        <linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.3" />
          <stop offset="100%" stopColor={color} stopOpacity="0.0" />
        </linearGradient>
      </defs>
      <polyline points={`0,${h} ${pts} ${w},${h}`} fill="url(#lg1)" stroke="none" />
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
};

// ─── DONUT CHART ──────────────────────────────────────────────────────────────
const DonutChart = ({ segments, size = 120, thickness = 22 }) => {
  const r = (size - thickness) / 2, cx = size / 2, cy = size / 2;
  const circ = 2 * Math.PI * r;
  let offset = 0;
  const total = segments.reduce((s, seg) => s + seg.value, 0);
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ transform: 'rotate(-90deg)' }}>
      {segments.map((seg, i) => {
        const dash = (seg.value / total) * circ;
        const gap = circ - dash;
        const el = <circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={seg.color} strokeWidth={thickness} strokeDasharray={`${dash} ${gap}`} strokeDashoffset={-offset} strokeLinecap="butt" />;
        offset += dash;
        return el;
      })}
    </svg>
  );
};

const downloadBookingInvoice = async (session, bookingId) => {
  if (!session?.token || !bookingId) throw new Error('Select a valid booking first.');
  const response = await fetch(`http://localhost:5000/api/payments/invoices/${bookingId}`, { headers: { Authorization: `Bearer ${session.token}` } });
  const invoice = await response.json();
  if (!response.ok) throw new Error(invoice.message || 'Invoice could not be loaded.');
  const lines = [
    'GIRI DARSHAN RESIDENCY', 'TAX INVOICE', '',
    `Invoice: ${invoice.invoice_number}`, `Booking: ${invoice.booking_ref}`,
    `Guest: ${invoice.customer_name}`, `Contact: ${invoice.customer_phone || 'Not provided'}`,
    `Room: ${invoice.room_type}${invoice.room_number ? ` (#${invoice.room_number})` : ''}`,
    `Check-in: ${String(invoice.check_in_date).slice(0,10)}`, `Check-out: ${String(invoice.check_out_date).slice(0,10)}`,
    `Payment: ${invoice.payment_status || invoice.invoice_status}`, `Subtotal: ${formatAUD(invoice.subtotal_inr)}`,
    `Tax: ${formatAUD(invoice.tax_inr)}`, `Total: ${formatAUD(invoice.total_inr)}`
  ];
  const blob = new Blob([lines.join('\r\n')], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a'); link.href = url; link.download = `${invoice.invoice_number || 'invoice'}.txt`; link.click();

};

      .finally(() => setLoading(false));
    return () => controller.abort();
  }, []);

  const filtered = rooms.filter(r => {
    if (r.price && r.price > priceMax) return false;
    if (types.length > 0 && !types.some(t => r.type.toLowerCase().includes(t))) return false;
    if (search && !r.type.toLowerCase().includes(search.toLowerCase())) return false;
    if (availability !== 'all' && r.status !== availability) return false;
    return true;
  }).sort((a, b) => {
    if (sort === 'price_asc') return (a.price || 0) - (b.price || 0);
    if (sort === 'price_desc') return (b.price || 0) - (a.price || 0);
    if (sort === 'rating') return (Number(b.rating) || 0) - (Number(a.rating) || 0);
    return 0;
  });

  const toggleType = t => setTypes(prev => prev.includes(t) ? prev.filter(x => x !== t) : [...prev, t]);

  return (
    <div style={{ paddingTop: 68, background: DS.c.ivory, minHeight: '100vh' }}>

          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 12, marginBottom: 20, paddingBottom: 14, borderBottom: `1px solid ${DS.c.border}` }}>
            <div style={{ fontFamily: DS.f.serif, fontSize: 18, fontWeight: 600 }}>Filters</div>
            <button aria-label="Hide filters" onClick={() => setFiltersOpen(false)} style={{ width: 32, height: 32, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', border: `1px solid ${DS.c.border}`, borderRadius: DS.r.md, background: DS.c.white, color: DS.c.textMid, cursor: 'pointer' }}>

            {[['non-a/c', 'Non-A/C Room'], ['a/c', 'A/C Room'], ['deluxe', 'Deluxe A/C Room'], ['suite room', 'Suite Room'], ['suite room non', 'Suite Room non-A/C']].map(([v, l]) => (

};

// ─── BOOKING PAGE ─────────────────────────────────────────────────────────────
const BookingPage = ({ setPage }) => {
  const session = React.useContext(AuthContext);
  const [step, setStep] = React.useState(1);
  const [payment, setPayment] = React.useState('card');
  const [form, setForm] = React.useState({ firstName: session?.user?.first_name || '', lastName: session?.user?.last_name || '', email: session?.user?.email || '', phone: session?.user?.phone || '', special: '' });
  const [termsAccepted, setTermsAccepted] = React.useState(false);
  const [bookingError, setBookingError] = React.useState('');

  const [roomType, setRoomType] = React.useState(() => { const id = Number(localStorage.getItem('gdr_room_type')); return ROOMS.find(r => r.id === id)?.type || ''; });
  const [adults, setAdults] = React.useState(() => { try { return Number(JSON.parse(localStorage.getItem('gdr_search') || '{}').guests) || 1; } catch (_) { return 1; } });
  const [kids, setKids] = React.useState(0);
  const [seniors, setSeniors] = React.useState(0);
  const [paymentError, setPaymentError] = React.useState('');

  const steps = ['Guest Details', 'Payment', 'Confirmation'];
  const selectedRoom = ROOMS.find(r => r.type === roomType) || ROOMS[0] || null;
  const guestCounts = [adults, kids, seniors].map(Number);
  const guestTotal = guestCounts.reduce((sum, value) => sum + (Number.isFinite(value) ? value : 0), 0);
  const [checkIn, setCheckIn] = React.useState(() => { try { return JSON.parse(localStorage.getItem('gdr_search') || '{}').checkIn || ''; } catch (_) { return ''; } });
  const [checkOut, setCheckOut] = React.useState(() => { try { return JSON.parse(localStorage.getItem('gdr_search') || '{}').checkOut || ''; } catch (_) { return ''; } });
  const [bookingId, setBookingId] = React.useState('');
  const [bookingRef, setBookingRef] = React.useState('');
  const [showConfirmation, setShowConfirmation] = React.useState(false);
  const nights = (checkIn && checkOut) ? Math.max(0, Math.ceil((new Date(checkOut) - new Date(checkIn)) / 86400000)) : 0;

  const createBooking = async () => {
    setBookingError('');
    if (!session?.token) { setBookingError('Please sign in before creating a booking.'); return; }
    if (!form.firstName.trim() || !form.lastName.trim() || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email.trim())) { setBookingError('Enter the guest name and a valid email address.'); return; }
    if (!termsAccepted) { setBookingError('Accept the terms and cancellation policy before continuing.'); return; }
    if (!checkIn || !checkOut || nights < 1) { setBookingError('Choose valid check-in and check-out dates.'); return; }
    if (!guestCounts.every(value => Number.isSafeInteger(value) && value >= 0 && value <= 100) || guestTotal < 1 || (selectedRoom.capacity && guestTotal > selectedRoom.capacity)) { setBookingError(selectedRoom.capacity ? `Enter whole-number guest counts with at least one guest and no more than ${selectedRoom.capacity} total.` : 'Enter valid whole-number guest counts with at least one guest.'); return; }
    try {
      const response = await fetch('http://localhost:5000/api/bookings', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.token}` }, body: JSON.stringify({ roomTypeId: selectedRoom.id, checkInDate: checkIn, checkOutDate: checkOut, adults: Number(adults), children: Number(kids), seniors: Number(seniors), primaryGuestName: `${form.firstName} ${form.lastName}`.trim(), customerPhone: form.phone, specialRequest: form.special }) });
      const data = await response.json();
      if (!response.ok) throw new Error(data.message || 'Booking could not be created.');
      setBookingId(String(data.id));
      setBookingRef(data.bookingRef || String(data.id));
      setStep(2);
    } catch (error) { setBookingError(error.message); }
  };
  const recordDemoPayment = async () => {
    setPaymentError('');
    try {
      const response = await fetch(`http://localhost:5000/api/payments/${bookingId}`, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.token}` }, body: JSON.stringify({ paymentMethod: payment === 'bank' ? 'bank_transfer' : payment, paymentStatus: 'paid' }) });
      const data = await response.json();

const AuthPage = ({ setPage, setSession }) => {
  const [mode, setMode] = React.useState('login');
  const [role, setRole] = React.useState('customer');
  const [email, setEmail] = React.useState('');
  const [password, setPassword] = React.useState('');
  const [firstName, setFirstName] = React.useState('');
  const [lastName, setLastName] = React.useState('');
  const [phone, setPhone] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  const [error, setError] = React.useState('');
  const request = React.useRef(null);
  React.useEffect(() => () => request.current?.abort(), []);
  const goHome = () => { request.current?.abort(); setPage('home'); };
  const loginAs = async (register = false) => {
    if (busy) return;
    if (register && role !== 'customer') { setError('Staff accounts must be created by an administrator.'); return; }
    if (register && (!firstName.trim() || !lastName.trim() || firstName.trim().length > 80 || lastName.trim().length > 80 || phone.trim().length > 30)) { setError('Enter your first and last name (up to 80 characters each) and a phone number up to 30 characters.'); return; }
    if (register && (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim()) || email.trim().length > 160)) { setError('Enter a valid email address.'); return; }
    if (register && (password.length < 8 || new TextEncoder().encode(password).length > 72)) { setError('Use at least 8 characters and no more than 72 bytes for your password.'); return; }
    if (!email.trim() || !password) { setError('Enter your email and password.'); return; }
    setBusy(true);
    setError('');
    request.current = new AbortController();
    const timeout = setTimeout(() => request.current?.abort(), 15000);
    try {
      const response = await fetch(AUTH_API + (register ? '/register' : '/login'), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email.trim(), password, role, ...(register ? { firstName: firstName.trim(), lastName: lastName.trim(), phone: phone.trim() } : {}) }),
        signal: request.current.signal
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.message || 'Sign in failed.');
      if (!data.token || !['customer', 'staff', 'admin'].includes(data.user?.role)) throw new Error('Invalid login response.');

      setSession({ token: data.token, user: data.user });
      setPage(data.user.role === 'admin' ? 'admin' : data.user.role === 'staff' ? 'staffverify' : 'customerdash');

      setError(err.name === 'AbortError' ? 'Request timed out. If you were creating an account, try signing in before submitting again.' : err instanceof TypeError ? 'Cannot reach the backend. Start the local API and try again.' : err.message);

  const loadDashboard = async () => {
    if (!session?.token) return;

    setLoading(true);
    setDashboardError('');

    try {
      const response = await fetch(
        'http://localhost:5000/api/dashboard/customer',
        {
          headers: {
            Authorization: `Bearer ${session.token}`
          }
        }
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.message || 'Dashboard data could not be loaded.'
        );
      }

      setDashboard(data);
    } catch (error) {
      setDashboardError(
        error.message || 'Dashboard data could not be loaded.'
      );
    } finally {
      setLoading(false);
    }
  };

  React.useEffect(() => {
    loadDashboard();

      return String(dateValue).slice(0, 10);
    }

    return date.toLocaleDateString('en-AU', {
      day: '2-digit',
      month: 'short',
      year: 'numeric'
    });

      'checked_out'

          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${session.token}`
          },
          body: JSON.stringify({
            status: 'cancelled'
          })
        }
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.message || 'Booking could not be cancelled.'
        );
      }

      setCancelTarget(null);

      // Reload dashboard from database

};

// ─── BOOKING MANAGEMENT ───────────────────────────────────────────────────────
const BookingManagement = ({ setPage }) => {
  const session = React.useContext(AuthContext);
  const [liveBookings, setLiveBookings] = React.useState([]);
  const [actionError, setActionError] = React.useState('');
  const [cancelling, setCancelling] = React.useState(null);
  const [busy, setBusy] = React.useState(false);
  const [customers, setCustomers] = React.useState([]);
  const [roomTypes, setRoomTypes] = React.useState([]);
  const [editing, setEditing] = React.useState(false);
  const [editDraft, setEditDraft] = React.useState({});
  const [newDraft, setNewDraft] = React.useState({customerId:'',roomTypeId:'',checkInDate:'',checkOutDate:'',adults:1,children:0,seniors:0});
  const [uploadBooking, setUploadBooking] = React.useState(null);
  const [uploadType, setUploadType] = React.useState('passport');
  const [uploadFile, setUploadFile] = React.useState(null);
  const mapBooking = b => ({ id: b.booking_ref, guest: b.customer_name, contact: b.customer_phone || 'Not provided', email: b.customer_email || '', room: b.room_type, checkIn: String(b.check_in_date || '').slice(0,10), checkOut: String(b.check_out_date || '').slice(0,10), nights: Math.max(0, Math.ceil((new Date(b.check_out_date)-new Date(b.check_in_date))/86400000)), total: Number(b.total_amount_inr || 0), paid: b.payment_status === 'paid', status: b.booking_status, bookingId: b.booking_id, adults:Number(b.adults||0), children:Number(b.children||0), seniors:Number(b.seniors||0), staffNotes:b.staff_notes || '', documentId:b.document_id, documentType:b.document_type, documentStatus:b.document_status });
  const loadBookings = async () => {
    const response = await fetch('http://localhost:5000/api/bookings', { headers: { Authorization: `Bearer ${session.token}` } });
    const data = await response.json();
    if (!response.ok) throw new Error(data.message || 'Bookings could not be loaded.');
    setLiveBookings(Array.isArray(data) ? data.map(mapBooking) : []);
  };
  const cancelBooking = async (booking) => {
    if (cancelling !== null) return;
    setCancelling(booking.bookingId); setActionError('');
    try {
      const r = await fetch(`http://localhost:5000/api/bookings/${booking.bookingId}/status`, {method:'PATCH',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.token}`},body:JSON.stringify({status:'cancelled'})});
      const d=await r.json(); if(!r.ok) throw new Error(d.message);
      await loadBookings(); setSelected(null); setShowModal(false);
    } catch(e){setActionError(e.message);} finally {setCancelling(null);}
  };
  const [search, setSearch] = React.useState('');
  const [filter, setFilter] = React.useState('all');
  const [selected, setSelected] = React.useState(null);
  const [showModal, setShowModal] = React.useState(false);
  React.useEffect(() => {
    if (!session?.token) return;
    Promise.all([
      loadBookings(),
      fetch('http://localhost:5000/api/bookings/customers', {headers:{Authorization:`Bearer ${session.token}`}}).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.message);setCustomers(d);}),
      fetch('http://localhost:5000/api/rooms/types').then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.message);setRoomTypes(d);})
    ]).catch(e => setActionError(e.message));
  }, [session?.token]);

  const openEdit = booking => { setSelected(booking); setEditing(true); setEditDraft({checkInDate:booking.checkIn,checkOutDate:booking.checkOut,adults:booking.adults,children:booking.children,seniors:booking.seniors,customerPhone:booking.contact === 'Not provided' ? '' : booking.contact,staffNotes:booking.staffNotes || ''}); setShowModal(true); };
  const saveEdit = async () => {
    setBusy(true); setActionError('');
    try { const r=await fetch(`http://localhost:5000/api/bookings/${selected.bookingId}`,{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.token}`},body:JSON.stringify(editDraft)}); const d=await r.json(); if(!r.ok)throw new Error(d.message); await loadBookings(); setShowModal(false); setEditing(false); }
    catch(e){setActionError(e.message);} finally{setBusy(false);}
  };
  const createBooking = async () => {
    setBusy(true); setActionError('');
    try { const r=await fetch('http://localhost:5000/api/bookings',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.token}`},body:JSON.stringify(newDraft)}); const d=await r.json(); if(!r.ok)throw new Error(d.message); await loadBookings(); setShowModal(false); setNewDraft({customerId:'',roomTypeId:'',checkInDate:'',checkOutDate:'',adults:1,children:0,seniors:0}); }
    catch(e){setActionError(e.message);} finally{setBusy(false);}
  };
  const changeStatus = async status => {
    setBusy(true); setActionError('');
    try { const r=await fetch(`http://localhost:5000/api/bookings/${selected.bookingId}/status`,{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.token}`},body:JSON.stringify({status})}); const d=await r.json();if(!r.ok)throw new Error(d.message);await loadBookings();setSelected({...selected,status}); }
    catch(e){setActionError(e.message);} finally{setBusy(false);}
  };
  const uploadDocument = async () => {
    if (!uploadFile) { setActionError('Choose a PDF, PNG or JPEG document.'); return; }
    setBusy(true); setActionError('');
    try { const fileData=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('Could not read document.'));reader.readAsDataURL(uploadFile);}); const r=await fetch(`http://localhost:5000/api/verifications/${uploadBooking.bookingId}/upload`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.token}`},body:JSON.stringify({documentType:uploadType,fileData})});const d=await r.json();if(!r.ok)throw new Error(d.message);await loadBookings();setUploadBooking(null);setUploadFile(null); }
    catch(e){setActionError(e.message);} finally{setBusy(false);}
  };

  const bookingRows = liveBookings;
  const filtered = bookingRows.filter(b => {
    const statuses = {checkedin:['checked_in'],checkedout:['checked_out'],pending:['pending','awaiting_payment','awaiting_verification']};
    if (filter !== 'all' && !(statuses[filter] || [filter]).includes(b.status)) return false;
    if (search && !b.guest.toLowerCase().includes(search.toLowerCase()) && !b.id.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });

  return (
    <AdminLayout page="bookingmgmt" setPage={setPage} title="Booking Management" subtitle="Manage all hotel reservations">
      <div style={{ padding: '24px 28px' }}>

              <button key={f} className={`ga-tab ${filter === f ? 'active' : ''}`} style={{ fontSize: 12, padding: '6px 14px' }} onClick={() => setFilter(f)}>
                {f === 'all' ? 'All' : f.charAt(0).toUpperCase() + f.slice(1)}

              <input className="ga-input" placeholder="Search bookings…" value={search} onChange={e => setSearch(e.target.value)} style={{ padding: '8px 14px 8px 34px', width: 220, maxWidth: '100%', fontSize: 13 }} />
              <span style={{ position: 'absolute', left: 10, top: '50%', transform: 'translateY(-50%)', color: DS.c.textMuted }}><Icon name="search" size={14} /></span>

        <div className="ga-card" style={{ overflow: 'hidden' }}>
          <table className="ga-table">
            <thead>
              <tr><th>Booking ID</th><th>Guest</th><th>Contact Number</th><th>Room</th><th>Check-In</th><th>Check-Out</th><th>Nights</th><th>Amount</th><th>Payment</th><th>Status</th><th>Documents</th><th>Actions</th></tr>
            </thead>
            <tbody>
              {filtered.map(b => (
                <tr key={b.id} style={{ cursor: 'pointer' }} onClick={() => { setSelected(b); setShowModal(true); }}>
                  <td style={{ fontFamily: DS.f.serif, fontWeight: 600, color: DS.c.navy }}>{b.id}</td>
                  <td>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      <div style={{ width: 28, height: 28, borderRadius: '50%', background: `${DS.c.gold}20`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, fontWeight: 600, color: DS.c.goldDark }}>{b.guest[0]}</div>
                      <span style={{ fontWeight: 500 }}>{b.guest}</span>
                    </div>
                  </td>
                  <td>{b.contact}</td>
                  <td>{b.room}</td>
                  <td>{b.checkIn}</td>
                  <td>{b.checkOut}</td>
                  <td style={{ textAlign: 'center' }}>{b.nights}</td>
                  <td style={{ fontWeight: 600 }}>{formatAUD(b.total)}</td>
                  <td><Badge status={b.paid ? 'paid' : 'unpaid'} text={b.paid ? 'Paid' : 'Unpaid'} /></td>
                  <td><Badge status={b.status} text={b.status} /></td>
                  <td onClick={e => e.stopPropagation()}><Button variant="outline" size="xs" icon="upload" onClick={() => { setUploadBooking(b); setUploadFile(null); }}>{b.documentId ? 'Replace' : 'Upload'}</Button>{b.documentStatus && <div style={{fontSize:10,color:DS.c.textMuted,marginTop:3}}>{b.documentStatus}</div>}</td>
                  <td onClick={e => e.stopPropagation()}>
                    <div style={{ display: 'flex', gap: 6 }}>
                      <button style={{ background: 'none', border: 'none', cursor: 'pointer', color: DS.c.info, padding: 4 }} title="Edit" onClick={() => openEdit(b)}><Icon name="edit" size={14} /></button>
                      <button style={{ background: 'none', border: 'none', cursor: 'pointer', color: DS.c.danger, padding: 4 }} title="Cancel" disabled={cancelling !== null || ['cancelled','checked_in','checked_out'].includes(b.status)} onClick={() => cancelBooking(b)}><Icon name="trash" size={14} /></button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          {filtered.length === 0 && <div style={{ textAlign: 'center', padding: '40px', color: DS.c.textMuted, fontSize: 14 }}>No bookings found matching your search.</div>}
        </div>
      </div>

      {/* Booking Detail Modal */}
      <Modal open={showModal} onClose={() => setShowModal(false)} title={selected ? `Booking ${selected.id}` : 'New Booking'} width={580}>
        {selected ? (editing ? (
          <div style={{display:'flex',flexDirection:'column',gap:14}}>
            {actionError && <p role="alert" style={{color:DS.c.danger,margin:0}}>{actionError}</p>}
            <Input label="Customer Contact Number" value={editDraft.customerPhone || ''} onChange={e=>setEditDraft({...editDraft,customerPhone:e.target.value})} />
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}><Input label="Check-In" type="date" value={editDraft.checkInDate} onChange={e=>setEditDraft({...editDraft,checkInDate:e.target.value})}/><Input label="Check-Out" type="date" value={editDraft.checkOutDate} onChange={e=>setEditDraft({...editDraft,checkOutDate:e.target.value})}/></div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:14}}><Input label="Adults" type="number" min="0" value={editDraft.adults} onChange={e=>setEditDraft({...editDraft,adults:Number(e.target.value)})}/><Input label="Children" type="number" min="0" value={editDraft.children} onChange={e=>setEditDraft({...editDraft,children:Number(e.target.value)})}/><Input label="Seniors" type="number" min="0" value={editDraft.seniors} onChange={e=>setEditDraft({...editDraft,seniors:Number(e.target.value)})}/></div>
            <div><label style={{fontSize:12,fontWeight:600,letterSpacing:'0.05em',color:DS.c.textMid,textTransform:'uppercase',display:'block',marginBottom:6}}>Staff Notes</label><textarea className="ga-input" rows="3" maxLength="1000" value={editDraft.staffNotes || ''} onChange={e=>setEditDraft({...editDraft,staffNotes:e.target.value})} placeholder="Add an internal note for staff…" style={{padding:'10px 14px',resize:'vertical'}} /></div>
            <div style={{display:'flex',gap:10}}><Button disabled={busy} variant="primary" fullWidth onClick={saveEdit}>Save Booking</Button><Button variant="outline" onClick={()=>setEditing(false)}>Cancel</Button></div>
          </div>
        ) : (
          <div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14, marginBottom: 20 }}>
              {[['Guest Name', selected.guest], ['Contact', selected.contact], ['Room', selected.room], ['Check-In', selected.checkIn], ['Check-Out', selected.checkOut], ['Total Amount', formatAUD(selected.total)]].map(([l, v]) => (
                <div key={l} style={{ padding: '12px 14px', background: DS.c.beigeLight, borderRadius: DS.r.md }}>

                  <div style={{ fontWeight: 600, fontSize: 14 }}>{v}</div>
                </div>
              ))}
            </div>
            <div style={{ display: 'flex', gap: 10, marginBottom: 16 }}>
              <Badge status={selected.status} text={selected.status} />
              <Badge status={selected.paid ? 'paid' : 'unpaid'} text={selected.paid ? 'Paid' : 'Unpaid'} />
            </div>
            <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
              <Select value={selected.status} onChange={e=>changeStatus(e.target.value)} options={['pending','awaiting_payment','awaiting_verification','confirmed','checked_in','checked_out','cancelled','rejected'].map(value=>({value,label:value.replaceAll('_',' ')}))} />
              <Button variant="primary" size="sm" icon="edit" onClick={()=>openEdit(selected)}>Edit Booking</Button>
              <Button variant="success" size="sm" icon="checkin" onClick={() => setPage('checkinout')}>Check In</Button>
              <Button variant="outline" size="sm" icon="download" onClick={()=>downloadBookingInvoice(session,selected.bookingId).catch(e=>setActionError(e.message))}>Invoice</Button>
              <Button variant="danger" size="sm" icon="trash" disabled={busy || ['cancelled','checked_in','checked_out'].includes(selected.status)} onClick={()=>cancelBooking(selected)}>Cancel</Button>
            </div>

          <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
            {actionError && <p role="alert" style={{color:DS.c.danger,margin:0}}>{actionError}</p>}
            <Select label="Customer" value={newDraft.customerId} onChange={e=>setNewDraft({...newDraft,customerId:e.target.value})} options={[{value:'',label:'Select customer'},...customers.map(c=>({value:String(c.id),label:`${c.first_name} ${c.last_name} · ${c.phone || c.email}`}))]} />
            <Select label="Room Type" value={newDraft.roomTypeId} onChange={e=>setNewDraft({...newDraft,roomTypeId:e.target.value})} options={[{value:'',label:'Select room type'},...roomTypes.map(r=>({value:String(r.id),label:r.type_name}))]} />
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
              <Input label="Check-In" type="date" value={newDraft.checkInDate} onChange={e=>setNewDraft({...newDraft,checkInDate:e.target.value})} required />
              <Input label="Check-Out" type="date" value={newDraft.checkOutDate} onChange={e=>setNewDraft({...newDraft,checkOutDate:e.target.value})} required />
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:14}}><Input label="Adults" type="number" min="0" value={newDraft.adults} onChange={e=>setNewDraft({...newDraft,adults:Number(e.target.value)})}/><Input label="Children" type="number" min="0" value={newDraft.children} onChange={e=>setNewDraft({...newDraft,children:Number(e.target.value)})}/><Input label="Seniors" type="number" min="0" value={newDraft.seniors} onChange={e=>setNewDraft({...newDraft,seniors:Number(e.target.value)})}/></div>
            <Button disabled={busy} variant="primary" size="md" fullWidth icon="plus" onClick={createBooking}>Create Booking</Button>
          </div>
        )}
      </Modal>
      <Modal open={!!uploadBooking} onClose={() => setUploadBooking(null)} title={uploadBooking ? `Upload document — ${uploadBooking.id}` : 'Upload document'} width={480}>
        <div style={{display:'flex',flexDirection:'column',gap:14}}>{actionError && <p role="alert" style={{color:DS.c.danger,margin:0}}>{actionError}</p>}<Select label="Document Type" value={uploadType} onChange={e=>setUploadType(e.target.value)} options={[{value:'passport',label:'Passport'},{value:'aadhaar_card',label:'Aadhaar Card'},{value:'drivers_license',label:'Driving Licence'},{value:'national_id',label:'National ID'},{value:'other',label:'Other'}]}/><input className="ga-input" type="file" accept=".pdf,.png,.jpg,.jpeg" onChange={e=>setUploadFile(e.target.files?.[0]||null)} style={{padding:10}}/><Button disabled={busy} variant="primary" fullWidth icon="upload" onClick={uploadDocument}>Upload Document</Button></div>
      </Modal>
    </AdminLayout>
  );
};

// ─── ROOM MANAGEMENT ──────────────────────────────────────────────────────────
const RoomManagement = ({ setPage }) => {
  const session = React.useContext(AuthContext);
  const [liveRooms, setLiveRooms] = React.useState(null);
  const [showModal, setShowModal] = React.useState(false);
  const [editRoom, setEditRoom] = React.useState(null);
  const [saveError, setSaveError] = React.useState('');
  const [saving, setSaving] = React.useState(false);
  const [roomTypes, setRoomTypes] = React.useState([]);
  const [draft, setDraft] = React.useState({roomNumber:'', roomTypeId:'', floorNumber:'', status:'available', notes:''});
  React.useEffect(() => { fetch('http://localhost:5000/api/rooms/types').then(async r => { if (!r.ok) throw new Error('Cannot load room types.'); return r.json(); }).then(setRoomTypes).catch(e => setSaveError(e.message)); }, []);
  const [view, setView] = React.useState('grid');
  React.useEffect(() => {
    if (!session?.token) return;
    fetch('http://localhost:5000/api/rooms', { headers: { Authorization: `Bearer ${session.token}` } }).then(r => r.json()).then(rows => Array.isArray(rows) && setLiveRooms(rows.map(r => ({ id: r.id, number: r.room_number, roomTypeId: r.room_type_id, type: r.type_name, price: Number(r.base_price_inr || 0), capacity: r.max_capacity, floor: r.floor_number, size: r.size_sqm ? `${r.size_sqm} sqm` : '', beds: r.bedrooms ? `${r.bedrooms} bed` : '', view: '', status: r.status, rating: '', notes: r.notes || '' })))).catch(() => {});
  }, [session?.token]);
  const roomRows = liveRooms || ROOMS;
  const openRoomModal = room => {
    setSaveError(''); setEditRoom(room || null);
    setDraft(room ? {roomNumber:String(room.number || ''),roomTypeId:String(room.roomTypeId || ''),floorNumber:room.floor ?? '',status:room.status || 'available',notes:room.notes || ''} : {roomNumber:'',roomTypeId:'',floorNumber:'',status:'available',notes:''});
    setShowModal(true);
  };
  const deleteRoom = async (id) => {
    if (!session?.token) return;
    const response = await fetch(`http://localhost:5000/api/rooms/${id}`, { method: 'DELETE', headers: { Authorization: `Bearer ${session.token}` } });
    if (response.ok) setLiveRooms(items => (items || []).filter(room => room.id !== id));
  };
  const saveRoom = async () => {
    if (saving) return;
    setSaveError('');
    if (!draft.roomNumber.trim() || !draft.roomTypeId) { setSaveError('Enter a room number and select its type.'); return; }
    if (!session?.token) { setSaveError('Please sign in again.'); return; }
    setSaving(true);
    try {
      const payload = {...draft, roomNumber:draft.roomNumber.trim(), floorNumber:draft.floorNumber === '' ? null : Number(draft.floorNumber)};
      const response = await fetch(`http://localhost:5000/api/rooms${editRoom ? '/' + editRoom.id : ''}`, { method: editRoom ? 'PATCH' : 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.token}` }, body: JSON.stringify(payload) });
      const data = await response.json();
      if (!response.ok) throw new Error(data.message || 'Room could not be saved.');
      const type = roomTypes.find(r => String(r.id) === String(draft.roomTypeId));
      if (editRoom) setLiveRooms(items => (items || []).map(room => room.id === editRoom.id ? { ...room, number:draft.roomNumber, floor:draft.floorNumber, status:draft.status, roomTypeId:draft.roomTypeId, type:type?.type_name || room.type, notes:draft.notes } : room));
      if (!editRoom) { setLiveRooms(items => [...(items || []), {id:data.id, number:draft.roomNumber, roomTypeId:draft.roomTypeId, type:type.type_name, price:Number(type.base_price_inr || 0), capacity:type.max_capacity, floor:draft.floorNumber, status:draft.status, notes:draft.notes, size:'', rating:''}]); }
      setDraft({roomNumber:'',roomTypeId:'',floorNumber:'',status:'available',notes:''});
      setShowModal(false);
    } catch (error) { setSaveError(error.message); }
    finally { setSaving(false); }
  };


  return (
    <AdminLayout page="roommgmt" setPage={setPage} title="Room Management" subtitle="Manage rooms, availability and pricing">
      <div style={{ padding: '24px 28px' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
          <div style={{ display: 'flex', gap: 4 }}>
            {['grid', 'table'].map(v => (
              <button key={v} className={`ga-tab ${view === v ? 'active' : ''}`} style={{ fontSize: 12 }} onClick={() => setView(v)}>
                {v.charAt(0).toUpperCase() + v.slice(1)} View
              </button>
            ))}
          </div>
          <Button variant="primary" size="sm" icon="plus" onClick={() => openRoomModal(null)}>Add New Room</Button>
        </div>

        {view === 'grid' ? (
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 18 }}>
            {roomRows.map(room => (
              <div key={room.id} className="ga-card" style={{ overflow: 'hidden' }}>
                <div style={{ position: 'relative' }}>
                  <RoomImgPlaceholder type={room.type} height={150} />
                  <div style={{ position: 'absolute', top: 10, right: 10 }}><Badge status={room.status} text={room.status} /></div>
                  <div style={{ position: 'absolute', bottom: 10, left: 10, background: 'rgba(11,22,40,0.7)', borderRadius: DS.r.sm, padding: '3px 8px' }}>
                    <span style={{ fontFamily: DS.f.serif, color: DS.c.gold, fontSize: 15, fontWeight: 600 }}>{formatRoomPrice(room)}</span>
                    <span style={{ fontSize: 10, color: 'rgba(255,255,255,0.6)' }}>{room.price ? '/night' : ''}</span>
                  </div>
                </div>
                <div style={{ padding: '14px 16px' }}>
                  <div style={{ fontFamily: DS.f.serif, fontSize: 16, fontWeight: 600, marginBottom: 4 }}>{room.type}</div>
                  <div style={{ fontSize: 12, color: DS.c.textMuted, marginBottom: 10 }}>{formatRoomMeta(room)}</div>
                  <div style={{ display: 'flex', gap: 8 }}>
                    <Button variant="outline" size="xs" icon="edit" onClick={() => openRoomModal(room)}>Edit</Button>
                    <Button variant="ghost" size="xs" icon="eye">Preview</Button>
                    <Button variant="ghost" size="xs" style={{ color: DS.c.danger, marginLeft: 'auto' }} icon="trash" onClick={() => deleteRoom(room.id)}>Delete</Button>
                  </div>
                </div>
              </div>
            ))}
          </div>
        ) : (
          <div className="ga-card" style={{ overflow: 'hidden' }}>
            <table className="ga-table">
              <thead><tr><th>Room</th><th>Type</th><th>Floor</th><th>Capacity</th><th>Size</th><th>Price/Night</th><th>Status</th><th>Rating</th><th>Actions</th></tr></thead>
              <tbody>
                {roomRows.map(r => (
                  <tr key={r.id}>
                    <td style={{ fontWeight: 600 }}>#{r.number || r.id}</td>
                    <td>{r.type}</td>
                    <td>{r.floor ? `Floor ${r.floor}` : 'From database'}</td>
                    <td>{r.capacity ? `${r.capacity} guests` : 'From database'}</td>
                    <td>{r.size}</td>
                    <td style={{ fontWeight: 600, color: DS.c.gold }}>{formatRoomPrice(r)}</td>
                    <td><Badge status={r.status} text={formatRoomStatus(r)} /></td>
                    <td><span style={{ color: DS.c.gold }}>★</span> {r.rating}</td>
                    <td>
                      <div style={{ display: 'flex', gap: 6 }}>
                        <button style={{ background: 'none', border: 'none', cursor: 'pointer', color: DS.c.info }} onClick={() => openRoomModal(r)}><Icon name="edit" size={14} /></button>
                        <button style={{ background: 'none', border: 'none', cursor: 'pointer', color: DS.c.danger }} onClick={() => deleteRoom(r.id)}><Icon name="trash" size={14} /></button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      <Modal open={showModal} onClose={() => setShowModal(false)} title={editRoom ? `Edit — ${editRoom.type}` : 'Add New Room'} width={600}>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
            {editRoom ? <Input label="Room Type" readOnly value={editRoom.type} /> : <Select label="Room Type" value={draft.roomTypeId} onChange={e => setDraft({...draft,roomTypeId:e.target.value})} options={[{value:'',label:'Select room type'}, ...roomTypes.map(r => ({value:String(r.id),label:r.type_name}))]} />}
            <Input label="Room Number" placeholder="e.g. 501" value={draft.roomNumber} onChange={e => setDraft({...draft,roomNumber:e.target.value})} />
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
            <Input label="Floor Number" placeholder="Floor number" type="number" min="0" value={draft.floorNumber} onChange={e => setDraft({...draft,floorNumber:e.target.value})} />
            <Select label="Status" value={draft.status} onChange={e => setDraft({...draft,status:e.target.value})} options={[{value:'available',label:'Available'},{value:'booked',label:'Booked'},{value:'occupied',label:'Occupied'},{value:'inactive',label:'Inactive'},{value:'maintenance',label:'Under Maintenance'}]} />
          </div>
          <div>
            <label style={{ fontSize: 12, fontWeight: 600, letterSpacing: '0.05em', color: DS.c.textMid, textTransform: 'uppercase', display: 'block', marginBottom: 6 }}>Description</label>
            <textarea className="ga-input" value={draft.notes} onChange={e=>setDraft({...draft,notes:e.target.value})} style={{ padding: '10px 14px', minHeight: 72, resize: 'vertical' }} placeholder="Operational room notes…" />
          </div>
          {saveError && <p role="alert" style={{color: DS.c.danger}}>{saveError}</p>}
          <div style={{ display: 'flex', gap: 10 }}>
            <Button disabled={saving} variant="primary" size="md" icon={editRoom ? 'check' : 'plus'} fullWidth onClick={saveRoom}>{editRoom ? 'Save Changes' : 'Add Room'}</Button>
            <Button variant="outline" size="md" onClick={() => setShowModal(false)}>Cancel</Button>
          </div>
        </div>
      </Modal>
    </AdminLayout>
  );
};

// ─── CHECK-IN / CHECK-OUT ─────────────────────────────────────────────────────
const CheckInOut = ({ setPage }) => {
  const session = React.useContext(AuthContext);
  const [bookings, setBookings] = React.useState([]);
  const [lookup, setLookup] = React.useState('');
  const [found, setFound] = React.useState(null);
  const [tab, setTab] = React.useState('checkin');
  const [actionError, setActionError] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  React.useEffect(() => { if (session?.token) fetch('http://localhost:5000/api/bookings', { headers: { Authorization: `Bearer ${session.token}` } }).then(async r => { const d=await r.json(); if(!r.ok) throw new Error(d.message||'Bookings could not be loaded.'); return d; }).then(rows => Array.isArray(rows) && setBookings(rows.map(b => ({ id:b.booking_ref, bookingId:b.booking_id, guest:b.customer_name, room:b.room_type, checkIn:String(b.check_in_date).slice(0,10), checkOut:String(b.check_out_date).slice(0,10), nights:Math.ceil((new Date(b.check_out_date)-new Date(b.check_in_date))/86400000), total:Number(b.total_amount_inr||0), status:b.booking_status })))).catch(e => setActionError(e.message)); }, [session?.token]);

  const doSearch = () => {
    const b = bookings.find(b => b.id.includes(lookup.toUpperCase()) || b.guest.toLowerCase().includes(lookup.toLowerCase()));
    setFound(b || 'notfound');
  };

  const sourceBookings = bookings;
  const todayCheckIns = sourceBookings.filter(b => b.status === 'confirmed').slice(0, 3);
  const todayCheckOuts = sourceBookings.filter(b => b.status === 'checked_in' || b.status === 'checkedin').slice(0, 2);
  const updateBookingStatus = async (booking, status) => {
    if (!booking?.bookingId || busy) return;
    setBusy(true); setActionError('');
    try { const r = await fetch(`http://localhost:5000/api/bookings/${booking.bookingId}/status`, { method:'PATCH', headers:{'Content-Type':'application/json', Authorization:`Bearer ${session.token}`}, body:JSON.stringify({status}) }); const d=await r.json(); if(!r.ok)throw new Error(d.message || 'Status could not be updated.'); const updated={...booking,status}; setBookings(rows=>rows.map(item=>item.bookingId===booking.bookingId?updated:item)); setFound(updated); }
    catch(e){setActionError(e.message);} finally{setBusy(false);}
  };
  const updateStatus = status => updateBookingStatus(found, status);

  return (
    <AdminLayout page="checkinout" setPage={setPage} title="Check-In / Check-Out" subtitle="Process guest arrivals and departures">
      <div style={{ padding: '24px 28px' }}>
        {actionError && <p role="alert" style={{color:DS.c.danger,marginBottom:14}}>{actionError}</p>}
        {/* Quick stats */}
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 16, marginBottom: 24 }}>
          <StatCard label="Expected Arrivals" value={String(todayCheckIns.length)} sub="Confirmed bookings" icon="checkin" color={DS.c.success} />
          <StatCard label="Expected Departures" value={String(todayCheckOuts.length)} sub="Checked-in bookings" icon="checkout" color={DS.c.warning} />
          <StatCard label="Currently Checked In" value={String(sourceBookings.filter(b=>['checked_in','checkedin'].includes(b.status)).length)} sub="Database records" icon="users" />

// ─── USER MANAGEMENT ──────────────────────────────────────────────────────────
const UserManagement = ({ setPage }) => {
  const session = React.useContext(AuthContext);
  const [users, setUsers] = React.useState([]);
  const [showModal, setShowModal] = React.useState(false);
  const [search, setSearch] = React.useState('');
  const [roleFilter, setRoleFilter] = React.useState('all');
  const [error, setError] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  const [editUser, setEditUser] = React.useState(null);
  const [draft, setDraft] = React.useState({firstName:'',lastName:'',email:'',phone:'',password:'',role:'customer'});
  const mapUser = u => ({ id:u.id, name:`${u.first_name} ${u.last_name}`, firstName:u.first_name, lastName:u.last_name, email:u.email, phone:u.phone||'', role:u.role, joined:u.created_at ? new Date(u.created_at).toLocaleDateString() : '', status:u.status });
  const loadUsers = async () => { const r=await fetch('http://localhost:5000/api/users',{headers:{Authorization:`Bearer ${session.token}`}});const d=await r.json();if(!r.ok)throw new Error(d.message||'Users could not be loaded.');setUsers(Array.isArray(d)?d.map(mapUser):[]); };
  const openUser = user => { setError('');setEditUser(user||null);setDraft(user?{firstName:user.firstName,lastName:user.lastName,email:user.email,phone:user.phone,password:'',role:user.role}:{firstName:'',lastName:'',email:'',phone:'',password:'',role:'customer'});setShowModal(true); };
  const saveUser = async () => {
    if (busy) return;
    setBusy(true); setError('');
    try {
      const r = await fetch(`http://localhost:5000/api/users${editUser?`/${editUser.id}`:''}`, {method:editUser?'PATCH':'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.token}`},body:JSON.stringify(draft)});
      const d = await r.json(); if (!r.ok) throw new Error(d.message);
      await loadUsers(); setDraft({firstName:'',lastName:'',email:'',phone:'',password:'',role:'customer'}); setEditUser(null); setShowModal(false);
    } catch(e) {setError(e.message);} finally {setBusy(false);}
  };
  const changeStatus = async (id, status) => {
    setError('');
    try {
      const r = await fetch(`http://localhost:5000/api/users/${id}/status`,{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.token}`},body:JSON.stringify({status})});
      const d=await r.json();if(!r.ok)throw new Error(d.message);
      setUsers(rows=>rows.map(u=>u.id===id?{...u,status}:u));
    } catch(e){setError(e.message);}
  };
  React.useEffect(() => {
    if (!session?.token) return;
    loadUsers().catch(e=>setError(e.message));
  }, [session?.token]);

  return (
    <AdminLayout page="usermgmt" setPage={setPage} title="User Management" subtitle="Staff, customers and role permissions">
      <div style={{ padding: '24px 28px' }}>
        {error && <p role="alert" style={{color:DS.c.danger}}>{error}</p>}
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 16, marginBottom: 24 }}>
          <StatCard label="Total Users" value={String(users.length)} sub="Loaded from database" icon="users" />
          <StatCard label="Active Staff" value={String(users.filter(u => u.role === 'staff' && u.status === 'active').length)} sub="Active staff accounts" icon="user" color={DS.c.info} />
          <StatCard label="New This Month" value={String(users.filter(u => u.joined && new Date(u.joined).getMonth() === new Date().getMonth()).length)} sub="Recent accounts" icon="plus" color={DS.c.success} trend={0} />
        </div>

        <div className="ga-card" style={{ overflow: 'hidden' }}>
          <div style={{ padding: '16px 20px', borderBottom: `1px solid ${DS.c.border}`, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <div style={{ display: 'flex', gap: 4 }}>
              {['all', 'admin', 'staff', 'customer'].map(r => (
                <button key={r} className={`ga-tab ${roleFilter === r ? 'active' : ''}`} onClick={() => setRoleFilter(r)} style={{ fontSize: 12 }}>{r.charAt(0).toUpperCase() + r.slice(1)}</button>
              ))}
            </div>
            <div style={{ display: 'flex', gap: 10 }}>
              <div style={{ position: 'relative' }}>
                <input className="ga-input" placeholder="Search users…" value={search} onChange={e => setSearch(e.target.value)} style={{ padding: '7px 14px 7px 32px', width: 200, fontSize: 13 }} />
                <span style={{ position: 'absolute', left: 10, top: '50%', transform: 'translateY(-50%)', color: DS.c.textMuted }}><Icon name="search" size={13} /></span>
              </div>
              <Button variant="primary" size="sm" icon="plus" onClick={() => openUser(null)}>Add User</Button>
            </div>
          </div>
          <table className="ga-table">
            <thead><tr><th>User</th><th>Email</th><th>Role</th><th>Joined</th><th>Bookings</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>
              {users.filter(u => (roleFilter === 'all' || u.role === roleFilter) && `${u.name} ${u.email}`.toLowerCase().includes(search.toLowerCase())).map(u => (
                <tr key={u.id}>
                  <td>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                      <div style={{ width: 32, height: 32, borderRadius: '50%', background: u.role === 'admin' ? `linear-gradient(135deg, ${DS.c.gold}, ${DS.c.goldDark})` : `${DS.c.navy}20`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 13, fontWeight: 600, color: u.role === 'admin' ? DS.c.navy : DS.c.navyMid }}>{u.name[0]}</div>
                      <span style={{ fontWeight: 500 }}>{u.name}</span>
                    </div>
                  </td>
                  <td style={{ fontSize: 13, color: DS.c.textMuted }}>{u.email}</td>
                  <td><Badge status={u.role} text={u.role} /></td>
                  <td style={{ fontSize: 13 }}>{u.joined}</td>
                  <td style={{ textAlign: 'center', fontWeight: 500 }}>{u.bookings || '—'}</td>
                  <td><Badge status={u.status === 'active' ? 'confirmed' : 'cancelled'} text={u.status} /></td>
                  <td>
                    <div style={{ display: 'flex', gap: 6 }}>
                      <button style={{ background: 'none', border: 'none', cursor: 'pointer', color: DS.c.info }} title="Edit user" onClick={() => openUser(u)}><Icon name="edit" size={14} /></button>
                      {u.status !== 'active' && <button style={{ background: 'none', border: 'none', cursor: 'pointer', color: DS.c.success }} title="Activate account" onClick={() => changeStatus(u.id, 'active')}><Icon name="check" size={14} /></button>}
                      <button style={{ background: 'none', border: 'none', cursor: 'pointer', color: DS.c.danger }} title="Deactivate account" onClick={() => changeStatus(u.id, 'inactive')}><Icon name="trash" size={14} /></button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      <Modal open={showModal} onClose={() => setShowModal(false)} title={editUser?`Edit ${editUser.name}`:'Add New User'} width={480}>
        {error && <p role="alert" style={{color:DS.c.danger}}>{error}</p>}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
            <Input value={draft.firstName} onChange={e => setDraft({...draft,firstName:e.target.value})} label="First Name" placeholder="First name" required />
            <Input value={draft.lastName} onChange={e => setDraft({...draft,lastName:e.target.value})} label="Last Name" placeholder="Last name" required />
          </div>
          <Input value={draft.email} onChange={e => setDraft({...draft,email:e.target.value})} label="Email" type="email" placeholder="user@example.com" required />
          <Input value={draft.phone} onChange={e => setDraft({...draft,phone:e.target.value})} label="Phone" placeholder="Phone number" />
          {editUser ? <Input value={editUser.role.charAt(0).toUpperCase()+editUser.role.slice(1)} label="Role" readOnly /> : <Select value={draft.role} onChange={e => setDraft({...draft,role:e.target.value})} label="Role" options={[{value:'customer',label:'Customer'},{value:'staff',label:'Hotel Staff'},{value:'admin',label:'Administrator'}]} />}
          {!editUser && <Input value={draft.password} onChange={e => setDraft({...draft,password:e.target.value})} label="Temporary Password" type="password" placeholder="Min. 8 characters" required />}
          <Button variant="primary" size="md" fullWidth icon="user" disabled={busy} onClick={saveUser}>{editUser?'Save User Changes':'Create User Account'}</Button>
        </div>
      </Modal>
    </AdminLayout>
  );
};

  const mapPayment = p => ({ id:p.transaction_ref || `PAY-${p.id}`, paymentId:p.id, bookingId:p.booking_id, guest:p.customer_name, email:p.customer_email, phone:p.customer_phone, booking:p.booking_ref, room:p.room_type, amount:Number(p.amount_inr||0), subtotal:Number(p.subtotal_inr??p.amount_inr??0),tax:Number(p.tax_inr||0),invoiceTotal:Number(p.total_inr??p.amount_inr??0),invoice:p.invoice_number||'Pending',method:p.payment_method,date:p.created_at?new Date(p.created_at).toLocaleDateString():'',status:p.payment_status});
  const loadPayments = async () => {const r=await fetch('http://localhost:5000/api/payments',{headers:{Authorization:`Bearer ${session.token}`}});const d=await r.json();if(!r.ok)throw new Error(d.message||'Payments could not be loaded.');const rows=Array.isArray(d)?d.map(mapPayment):[];setTransactions(rows);setSelectedPayment(current=>current?rows.find(row=>row.paymentId===current.paymentId)||rows[0]||null:rows[0]||null);};

  const updatePaymentStatus = async (payment,status) => {setPaymentPageError('');try{const r=await fetch(`http://localhost:5000/api/payments/${payment.paymentId}/status`,{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.token}`},body:JSON.stringify({paymentStatus:status})});const d=await r.json();if(!r.ok)throw new Error(d.message);await loadPayments();}catch(e){setPaymentPageError(e.message);}};
  const paidTotal = transactions.filter(t => t.status === 'paid').reduce((s,t) => s+t.amount, 0);

          <StatCard label="Transactions" value={String(transactions.length)} sub="Database transactions" icon="trend" trend={0} />

          <div>
            <div style={{ display: 'flex', gap: 4, marginBottom: 16 }}>
              {['transactions', 'invoices'].map(t => (
                <button key={t} className={`ga-tab ${tab === t ? 'active' : ''}`} style={{ fontSize: 12 }} onClick={() => setTab(t)}>
                  {t.charAt(0).toUpperCase() + t.slice(1)}

            <div className="ga-card" style={{ overflow: 'hidden' }}>
              <table className="ga-table">
                <thead><tr><th>Transaction ID</th><th>Guest</th><th>Booking</th><th>Amount</th><th>Method</th><th>Date</th><th>Status</th><th></th></tr></thead>
                <tbody>
                  {transactions.length === 0 ? (
                    <tr><td colSpan="8" style={{ textAlign: 'center', padding: 24, color: DS.c.textMuted }}>No payment or invoice records loaded from database.</td></tr>
                  ) : transactions.map(t => (
                    <tr key={t.id} onClick={()=>setSelectedPayment(t)} style={{cursor:'pointer',background:selectedPayment?.paymentId===t.paymentId?DS.c.beigeLight:undefined}}>
                      <td style={{ fontFamily: DS.f.serif, fontSize: 12, fontWeight: 600, color: DS.c.navy }}>{t.id}</td>
                      <td style={{ fontWeight: 500 }}>{t.guest}</td>
                      <td style={{ fontSize: 12, color: DS.c.gold }}>{t.booking}</td>

                      <td onClick={e=>e.stopPropagation()}><select className="ga-input" value={t.status} onChange={e=>updatePaymentStatus(t,e.target.value)} style={{padding:'5px 8px',fontSize:12}}><option value="pending">Pending</option><option value="paid">Paid</option><option value="failed">Failed</option><option value="refunded">Refunded</option><option value="cancelled">Cancelled</option></select></td>
                      <td onClick={e=>e.stopPropagation()}><Button variant="ghost" size="xs" icon="download" onClick={()=>downloadBookingInvoice(session,t.bookingId).catch(e=>setPaymentPageError(e.message))}>Invoice</Button></td>

              <div style={{ border: `1px solid ${DS.c.border}`, borderRadius: DS.r.md, overflow: 'hidden' }}>
                <div style={{ background: DS.c.navy, padding: '16px 18px' }}>

                      <div key={l} style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, marginBottom: 6 }}>
                        <span style={{ color: DS.c.textMid }}>{l}</span><span style={{ fontWeight: 500 }}>{v}</span>
